name: "Setup Go + Task"
description: "Set up Go 1.26, install Task, and optionally cache task-installed tools (bin/); requires a prior actions/checkout step"

inputs:
  task-version:
    description: "Version of go-task to install"
    required: false
    default: "v3.52.0"
  cache-bin:
    description: "Cache the bin/ directory with task-installed tools"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@v6.4.0
      with:
        go-version: "1.26.2"
        cache-dependency-path: "**/go.sum"

    - name: Cache task-installed binaries
      if: inputs.cache-bin == 'true'
      uses: actions/cache@v5.0.5
      with:
        path: bin
        key: ${{ runner.os }}-task-bin-${{ hashFiles('Taskfile.yaml') }}
        restore-keys: |
          ${{ runner.os }}-task-bin-

    - name: Install Task
      shell: bash
      run: go install github.com/go-task/task/v3/cmd/task@${{ inputs.task-version }}
