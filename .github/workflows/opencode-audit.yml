name: Weekly Code Audit
on:
  schedule:
    - cron: "0 5 * * *"  # Every day at 5am UTC
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for OpenCode"
        required: true
        type: string
      model:
        description: "Model to use"
        required: false
        default: "opencode/big-pickle"
        type: string
jobs:
  opencode-audit:
    # Для schedule github.actor = github-actions[bot], поэтому guard применяем
    # только к ручному запуску workflow_dispatch. Автоматический запуск агентами запрещён.
    if: ${{ github.event_name != 'workflow_dispatch' || !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure git identity
        run: |
          git config user.name "opencode-audit[bot]"
          git config user.email "opencode-audit[bot]@users.noreply.github.com"
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ inputs.model || 'opencode/big-pickle' }}
          use_github_token: true
          share: false
          prompt: ${{ inputs.prompt || 'Review the codebase for TODO, FIXME, and HACK comments in source files and in docs/TODO.md. Write the complete audit report to audit-report.md in the repository root. If there are actionable findings, create a single GitHub issue by running gh issue create with --body-file audit-report.md and a fitting title; first check gh issue list --state open and skip creation if a similar issue already exists. Include the created issue URL in your final summary. Do not run any git add, git commit or git push commands.' }}
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.md
          if-no-files-found: warn