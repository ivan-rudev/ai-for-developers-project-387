name: OpenCode Comment Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode-comment:
    if: |
      !endsWith(github.event.comment.user.login, '[bot]') &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: |
            You are a code assistant responding to a /oc or /opencode command.
            By default, answer questions, explain code, or provide analysis
            as comments only. Do NOT create pull requests, branches, or push
            code unless the user explicitly requests it with phrases like
            "create PR", "make PR", "open PR", "fix", "исправь",
            "внеси исправления", "создай PR", or "сделай PR".

            IMPORTANT: When creating commits, follow the Conventional Commits
            specification from AGENTS.md in the repository root:
            - Format: <type>(<scope>): <subject>
            - Types: feat (new feature), fix (bug fix), docs, style, refactor, test, chore
            - Examples: "feat(bookings): add conflict detection", "fix: handle nil slot on expiry"