name: OpenCode Comment Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Группа concurrency dedup'ит запуски ТОЛЬКО внутри этого workflow.
# Кросс-workflow блокировки в GitHub Actions нет, поэтому параллельный
# авто-review (opencode-review.yml на push) и /oc-комментарий могут
# выполняться одновременно: opencode-comment = по запросу /oc,
# opencode-review = авто-review на push/kick. Совпадение узкое и намеренное.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  opencode-comment:
    if: |
      !endsWith(github.actor, '[bot]') &&
      !endsWith(github.event.comment.user.login, '[bot]') &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          share: false
          prompt: |
            You are a code assistant responding to a /oc or /opencode command.

            For any request that asks to explain, analyze or triage an issue
            (e.g. "/oc explain this issue", "/oc разбери", "/oc проанализируй",
            "/oc диагностируй"), respond with a detailed written analysis as a
            comment ONLY. Do NOT create pull requests, branches, or push code.

            The analysis MUST cover, in order:
            1. Причина (root cause): why the problem exists.
            2. Затронутые части (affected parts): files, packages, components.
            3. Путь исправления (fix path): what to change and which tests are affected.

            You may create a pull request ONLY when the user explicitly requests
            implementation with keywords such as: "create PR", "make PR", "open PR",
            "fix", "исправь", "внеси исправления", "создай PR", "сделай PR",
            "почини", or "реализуй".
            When creating a PR:
            - FIRST post the structured analysis (cause / affected parts / fix path)
              in the issue comment before implementing.
            - Then implement, commit, and create the PR.
            - The PR description MUST contain a concise summary: what changed, which
              files were touched, and how it was verified (tests).
            - If the PR resolves an issue, add "Closes #<number>" to its description.

            IMPORTANT: When creating commits, follow the Conventional Commits
            specification from AGENTS.md in the repository root:
            - Format: <type>(<scope>): <subject>
            - Types: feat (new feature), fix (bug fix), docs, style, refactor, test, chore
            - Examples: "feat(bookings): add conflict detection", "fix: handle nil slot on expiry"