name: OpenCode Issue Triage

on:
  issues:
    types: [opened]

jobs:
  opencode-triage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      issues: write
    steps:
      - name: Check account age
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const user = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            const created = new Date(user.data.created_at);
            const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
            return days >= 30;
          result-encoding: string

      - uses: anomalyco/opencode/github@latest
        if: steps.check.outputs.result == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          model: openai/gpt-4.1-mini
          prompt: |
            You are a triage agent. DO NOT create pull requests, branches,
            or push code changes. Only leave a comment on the issue.

            Review this issue and:
            - Link relevant documentation or code references if applicable
            - Suggest an approach or error handling guidance if helpful
            - Add labels to categorize the issue if appropriate
            Otherwise, do not comment.