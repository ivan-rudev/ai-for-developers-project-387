version: '3'

vars:
  GOLANGCI_LINT_VERSION: 'v2.11.4'
  GCI_VERSION: 'v0.14.0'
  GOFUMPT_VERSION: 'v0.9.2'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'

tasks:
  default:
    desc: "Показывает список доступных задач"
    cmds:
      - task --list

  formatters:install:
    desc: "Устанавливает gofumpt и gci"
    cmds:
      - echo 'Installing gofumpt...'
      - GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
      - echo 'Installing gci...'
      - GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  golangci-lint:install:
    desc: "Устанавливает golangci-lint"
    cmds:
      - echo 'Installing golangci-lint...'
      - CGO_ENABLED=0 GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
    status:
      - test -x {{.GOLANGCI_LINT}}

  setup:
    desc: "Устанавливает все инструменты и npm-зависимости"
    deps: [formatters:install, golangci-lint:install]
    cmds:
      - echo 'Installing npm dependencies...'
      - npm ci

  format:
    desc: "Форматирует Go-код (gofumpt + gci)"
    deps: [formatters:install]
    cmds:
      - echo 'Formatting code with gofumpt...'
      - find . -type f -name '*.go' -exec {{.GOFUMPT}} -extra -w {} +
      - echo 'Sorting imports with gci...'
      - find . -type f -name '*.go' -exec {{.GCI}} write -s standard -s default -s "prefix(github.com/ivan-rudev/ai-for-developers-project-387)" {} +

  build:
    desc: "Собирает проект (go build ./...)"
    cmds:
      - go build ./...

  run:
    desc: "Запускает сервер локально"
    cmds:
      - go run ./cmd/server

  vet:
    desc: "Запускает go vet"
    cmds:
      - go vet ./...

  lint:
    desc: "Запускает golangci-lint"
    deps: [golangci-lint:install]
    cmds:
      - '{{.GOLANGCI_LINT}} run --allow-parallel-runners ./...'

  test:
    desc: "Запускает юнит-тесты с race-детектором"
    cmds:
      - go test -v -race -count=1 ./...

  gen:api:
    desc: "Генерирует OpenAPI из TypeSpec"
    cmds:
      - npm run build:api

  watch:api:
    desc: "Перегенерирует OpenAPI в watch-режиме"
    cmds:
      - npm run watch:api

  check:api:
    desc: "Проверяет, что OpenAPI синхронизирован с TypeSpec (для CI)"
    cmds:
      - task: gen:api
      - git diff --exit-code api/generated/openapi.yaml

  docker:build:
    desc: "Собирает Docker-образ"
    cmds:
      - docker build -t calendar-mvp .

  docker:run:
    desc: "Запускает Docker-контейнер с volume (порт из PORT, по умолчанию 8080)"
    vars:
      PORT: '{{.PORT | default "8080"}}'
    cmds:
      - docker run -p '{{.PORT}}:{{.PORT}}' -e 'PORT={{.PORT}}' -v calendar-data:/app/data calendar-mvp

  ci:
    desc: "Полная проверка перед коммитом"
    cmds:
      - task: check:api
      - task: vet
      - task: lint
      - task: test
