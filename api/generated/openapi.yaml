security:
  - {}
components:
  schemas:
    Booking:
      type: object
      required:
        - owner_uuid
        - guest_name
        - event_name
        - duration_minutes
        - start_time
        - end_time
      properties:
        owner_uuid:
          $ref: '#/components/schemas/uuid'
        guest_name:
          type: string
        event_name:
          type: string
        duration_minutes:
          type: integer
          format: int32
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    BookingAdmin:
      type: object
      required:
        - event_name
        - duration_minutes
        - guest_name
        - guest_email
        - start_time
        - end_time
      properties:
        event_name:
          type: string
        duration_minutes:
          type: integer
          format: int32
        guest_name:
          type: string
        guest_email:
          $ref: '#/components/schemas/email'
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateBookingRequest:
      type: object
      required:
        - owner_uuid
        - event_uuid
        - guest_name
        - guest_email
        - date
        - start_time
      properties:
        owner_uuid:
          $ref: '#/components/schemas/uuid'
        event_uuid:
          $ref: '#/components/schemas/uuid'
        guest_name:
          type: string
        guest_email:
          $ref: '#/components/schemas/email'
        date:
          type: string
          format: date
        start_time:
          $ref: '#/components/schemas/timeString'
    CreateEventRequest:
      type: object
      required:
        - name
        - duration_minutes
      properties:
        name:
          type: string
        description:
          type: string
        duration_minutes:
          type: integer
          format: int32
          minimum: 1
    CreateOwnerRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          $ref: '#/components/schemas/email'
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
    Event:
      type: object
      required:
        - uuid
        - name
        - duration_minutes
        - is_active
      properties:
        uuid:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
        description:
          type: string
        duration_minutes:
          type: integer
          format: int32
          minimum: 1
        is_active:
          type: boolean
    Guest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          $ref: '#/components/schemas/email'
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Owner:
      type: object
      required:
        - uuid
        - name
        - settings
      properties:
        uuid:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
        settings:
          $ref: '#/components/schemas/OwnerSettings'
    OwnerSettings:
      type: object
      required:
        - work_start
        - work_end
        - timezone
        - working_days
      properties:
        work_start:
          $ref: '#/components/schemas/timeString'
        work_end:
          $ref: '#/components/schemas/timeString'
        timezone:
          $ref: '#/components/schemas/timezone'
        working_days:
          type: array
          items:
            $ref: '#/components/schemas/WorkingDay'
    OwnerSummary:
      type: object
      required:
        - uuid
        - name
      properties:
        uuid:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
    Slot:
      type: object
      required:
        - time
        - status
      properties:
        time:
          $ref: '#/components/schemas/timeString'
        status:
          $ref: '#/components/schemas/SlotStatus'
        reason:
          $ref: '#/components/schemas/UnavailableReason'
    SlotStatus:
      type: string
      enum:
        - available
        - unavailable
    SlotsResponse:
      type: object
      required:
        - event_uuid
        - event_name
        - duration_minutes
        - timezone
        - start_date
        - end_date
        - slots
      properties:
        event_uuid:
          $ref: '#/components/schemas/uuid'
        event_name:
          type: string
        duration_minutes:
          type: integer
          format: int32
        timezone:
          $ref: '#/components/schemas/timezone'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        slots:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Slot'
    UnavailableReason:
      type: string
      enum:
        - booked
        - past
    WorkingDay:
      type: string
      enum:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
    email:
      type: string
      format: email
    timeString:
      type: string
      pattern: ^([01]\d|2[0-3]):[0-5]\d$
    timezone:
      type: string
    uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
servers:
  - url: http://localhost:8080
    description: Local development server
    variables: {}
